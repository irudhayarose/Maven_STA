<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Course- Class Sync</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <nav class="navbar">
        <a href="/dashboard" class="logo"><i class="fas fa-graduation-cap"></i> Class Sync</a>
        <div class="nav-right">
            <span class="role-badge">Admin</span>
            <form th:action="@{/logout}" method="POST" style="display:inline;">
                <button type="submit" class="logout-btn"><i class="fas fa-sign-out-alt"></i> Logout</button>
            </form>
        </div>
    </nav>
    <div class="container">
        <div class="page-header">
            <h1><i class="fas fa-book-open"></i> Manage Courses</h1>
            <a href="/admin/courses/add" class="btn btn-primary"><i class="fas fa-plus"></i> Add Course</a>
        </div>
        <div class="card">
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Code</th>
                            <th>Course Name</th>
                            <th>Credits</th>
                            <th>Semester</th>
                            <th>Faculty</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="course : ${courses}">
                            <td><strong th:text="${course.courseCode}"></strong></td>
                            <td th:text="${course.courseName}"></td>
                            <td th:text="${course.credits}"></td>
                            <td th:text="${course.semester}"></td>
                            <td th:text="${course.faculty != null ? course.faculty.user.firstName + ' ' + course.faculty.user.lastName : 'N/A'}"></td>
                            <td>
                                <a th:href="@{/admin/courses/delete/{id}(id=${course.id})}" class="btn btn-danger btn-sm"
                                   onclick="return confirm('Are you sure?')">
                                    <i class="fas fa-trash"></i>
                                </a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div th:if="${#lists.isEmpty(courses)}" class="empty-state">
                <i class="fas fa-book"></i>
                <p>No courses found</p>
            </div>
        </div>
        <a href="/dashboard" class="btn btn-secondary"><i class="fas fa-arrow-left"></i> Back to Dashboard</a>
    </div>
</body>
</html>
