<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Marks - Class Sync</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <nav class="navbar">
        <a href="/dashboard" class="logo"><i class="fas fa-graduation-cap"></i> Class Sync</a>
        <div class="nav-right">
            <span class="role-badge">Faculty</span>
            <form th:action="@{/logout}" method="POST" style="display:inline;">
                <button type="submit" class="logout-btn"><i class="fas fa-sign-out-alt"></i> Logout</button>
            </form>
        </div>
    </nav>
    <div class="container">
        <div class="page-header">
            <h1><i class="fas fa-pen-to-square"></i> Upload Marks</h1>
        </div>

        <div th:if="${param.success}" class="alert alert-success">
            <i class="fas fa-check-circle"></i> Marks uploaded successfully!
        </div>

        <div class="card">
            <h2><i class="fas fa-file-pen"></i> Enter Student Marks</h2>
            <form th:action="@{/faculty/marks/upload}" method="POST">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="courseId">Course</label>
                        <select id="courseId" name="courseId" required>
                            <option value="">Select Course</option>
                            <option th:each="course : ${courses}" th:value="${course.id}" th:text="${course.courseCode + ' - ' + course.courseName}"></option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="studentId">Student</label>
                        <select id="studentId" name="studentId" required>
                            <option value="">Select Student</option>
                            <option th:each="student : ${students}" th:value="${student.id}" th:text="${student.studentId + ' - ' + student.user.firstName + ' ' + student.user.lastName}"></option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="midtermMarks">Midterm Marks (out of 45)</label>
                        <input type="number" id="midtermMarks" name="midtermMarks" required min="0" max="45" step="0.5" placeholder="0-45">
                    </div>
                    <div class="form-group">
                        <label for="finalMarks">Final Marks (out of 40)</label>
                        <input type="number" id="finalMarks" name="finalMarks" required min="0" max="40" step="0.5" placeholder="0-40">
                    </div>
                    <div class="form-group">
                        <label for="projectMarks">Project Marks (out of 15)</label>
                        <input type="number" id="projectMarks" name="projectMarks" required min="0" max="15" step="0.5" placeholder="0-15">
                    </div>
                </div>
                <button type="submit" class="btn btn-success"><i class="fas fa-upload"></i> Upload Marks</button>
            </form>
        </div>

        <div class="card" th:if="${records != null && !records.isEmpty()}">
            <h2><i class="fas fa-table"></i> Uploaded Records</h2>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Student</th>
                            <th>Course</th>
                            <th>Midterm</th>
                            <th>Final</th>
                            <th>Project</th>
                            <th>Total</th>
                            <th>Grade</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="rec : ${records}">
                            <td th:text="${rec.student.studentId}"></td>
                            <td th:text="${rec.course.courseCode}"></td>
                            <td th:text="${rec.midtermMarks}"></td>
                            <td th:text="${rec.finalMarks}"></td>
                            <td th:text="${rec.projectMarks}"></td>
                            <td><strong th:text="${rec.totalMarks}"></strong></td>
                            <td><span class="badge badge-grade" th:text="${rec.grade}"></span></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
        <a href="/dashboard" class="btn btn-secondary"><i class="fas fa-arrow-left"></i> Back to Dashboard</a>
    </div>
</body>
</html>
