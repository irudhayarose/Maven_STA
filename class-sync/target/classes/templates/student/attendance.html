<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Attendance - Class Sync</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .attendance-summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.25rem;
            margin-bottom: 1.5rem;
        }
        .summary-card {
            background: white;
            border-radius: 12px;
            padding: 1.5rem;
            text-align: center;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
        }
        .summary-card .value {
            font-size: 2.5rem;
            font-weight: 700;
            margin: 0.5rem 0;
        }
        .summary-card .desc {
            color: #888;
            font-size: 0.85rem;
        }
        .summary-card.green .value { color: #27ae60; }
        .summary-card.red .value { color: #e74c3c; }
        .summary-card.blue .value { color: #667eea; }
        .progress-bar {
            width: 100%;
            height: 12px;
            background: #e0e3e8;
            border-radius: 6px;
            overflow: hidden;
            margin-top: 0.5rem;
        }
        .progress-bar .fill {
            height: 100%;
            border-radius: 6px;
            transition: width 0.5s ease;
        }
        .fill-green { background: linear-gradient(135deg, #2ecc71, #27ae60); }
        .fill-yellow { background: linear-gradient(135deg, #f39c12, #e67e22); }
        .fill-red { background: linear-gradient(135deg, #e74c3c, #c0392b); }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="/dashboard" class="logo"><i class="fas fa-graduation-cap"></i> Class Sync</a>
        <div class="nav-right">
            <span class="role-badge">Student</span>
            <form th:action="@{/logout}" method="POST" style="display:inline;">
                <button type="submit" class="logout-btn"><i class="fas fa-sign-out-alt"></i> Logout</button>
            </form>
        </div>
    </nav>
    <div class="container">
        <div class="page-header">
            <h1><i class="fas fa-calendar-check"></i> My Attendance</h1>
        </div>

        <div class="attendance-summary">
            <div class="summary-card blue">
                <i class="fas fa-calendar" style="font-size:1.5rem; color:#667eea;"></i>
                <div class="value" th:text="${totalClasses}">0</div>
                <div class="desc">Total Classes</div>
            </div>
            <div class="summary-card green">
                <i class="fas fa-check-circle" style="font-size:1.5rem; color:#27ae60;"></i>
                <div class="value" th:text="${presentCount}">0</div>
                <div class="desc">Present</div>
            </div>
            <div class="summary-card red">
                <i class="fas fa-times-circle" style="font-size:1.5rem; color:#e74c3c;"></i>
                <div class="value" th:text="${totalClasses - presentCount}">0</div>
                <div class="desc">Absent</div>
            </div>
            <div class="summary-card">
                <i class="fas fa-percentage" style="font-size:1.5rem; color:#667eea;"></i>
                <div class="value" th:text="${percentage + '%'}">0%</div>
                <div class="desc">Attendance Rate</div>
                <div class="progress-bar">
                    <div class="fill" th:classappend="${percentage >= 75 ? 'fill-green' : (percentage >= 50 ? 'fill-yellow' : 'fill-red')}"
                         th:style="'width:' + ${percentage} + '%'"></div>
                </div>
            </div>
        </div>

        <div class="card">
            <h2><i class="fas fa-list"></i> Attendance Records</h2>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Course</th>
                            <th>Status</th>
                            <th>Remarks</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="att : ${attendances}">
                            <td th:text="${att.date}"></td>
                            <td th:text="${att.course.courseCode + ' - ' + att.course.courseName}"></td>
                            <td>
                                <span th:if="${att.present}" class="badge badge-present"><i class="fas fa-check"></i> Present</span>
                                <span th:unless="${att.present}" class="badge badge-absent"><i class="fas fa-times"></i> Absent</span>
                            </td>
                            <td th:text="${att.remarks != null ? att.remarks : '-'}"></td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div th:if="${attendances == null || attendances.isEmpty()}" class="empty-state">
                <i class="fas fa-calendar-xmark"></i>
                <p>No attendance records found</p>
            </div>
        </div>
        <div style="display:flex; gap:1rem;">
            <a href="/student/dashboard" class="btn btn-secondary"><i class="fas fa-arrow-left"></i> Back to My Dashboard</a>
            <a href="/dashboard" class="btn btn-secondary"><i class="fas fa-home"></i> Home</a>
        </div>
    </div>
</body>
</html>
