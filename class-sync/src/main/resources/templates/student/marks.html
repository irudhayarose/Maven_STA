<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Marks - Class Sync</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .gpa-card {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border-radius: 12px;
            padding: 2rem;
            text-align: center;
            margin-bottom: 1.5rem;
            position: relative;
            overflow: hidden;
        }
        .gpa-card::after {
            content: '';
            position: absolute;
            top: -40%;
            right: -15%;
            width: 200px;
            height: 200px;
            background: rgba(255,255,255,0.08);
            border-radius: 50%;
        }
        .gpa-card h2 {
            color: rgba(255,255,255,0.9);
            margin-bottom: 0.5rem;
        }
        .gpa-value {
            font-size: 4rem;
            font-weight: 700;
            position: relative;
            z-index: 1;
        }
        .gpa-label {
            font-size: 0.9rem;
            opacity: 0.8;
            margin-top: 0.25rem;
        }
        .marks-bar {
            display: flex;
            gap: 2px;
            height: 8px;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 0.5rem;
        }
        .marks-bar .segment {
            height: 100%;
        }
        .seg-midterm { background: #667eea; }
        .seg-final { background: #764ba2; }
        .seg-project { background: #2ecc71; }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="/dashboard" class="logo"><i class="fas fa-graduation-cap"></i> Class Sync</a>
        <div class="nav-right">
            <span class="role-badge">Student</span>
            <form th:action="@{/logout}" method="POST" style="display:inline;">
                <button type="submit" class="logout-btn"><i class="fas fa-sign-out-alt"></i> Logout</button>
            </form>
        </div>
    </nav>
    <div class="container">
        <div class="page-header">
            <h1><i class="fas fa-graduation-cap"></i> My Academic Records</h1>
        </div>

        <div class="gpa-card">
            <h2><i class="fas fa-trophy"></i> Overall GPA</h2>
            <div class="gpa-value" th:text="${gpa}">0.00</div>
            <div class="gpa-label">Cumulative Grade Point Average</div>
        </div>

        <div class="card">
            <h2><i class="fas fa-table"></i> Course-wise Marks</h2>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Course</th>
                            <th>Midterm (45)</th>
                            <th>Final (40)</th>
                            <th>Project (15)</th>
                            <th>Total (100)</th>
                            <th>Grade</th>
                            <th>Grade Points</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="rec : ${records}">
                            <td>
                                <strong th:text="${rec.course.courseCode}"></strong>
                                <br><small th:text="${rec.course.courseName}" style="color:#888;"></small>
                            </td>
                            <td th:text="${rec.midtermMarks}"></td>
                            <td th:text="${rec.finalMarks}"></td>
                            <td th:text="${rec.projectMarks}"></td>
                            <td><strong th:text="${rec.totalMarks}"></strong></td>
                            <td><span class="badge badge-grade" th:text="${rec.grade}"></span></td>
                            <td th:text="${rec.gradePoint}"></td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div th:if="${records == null || records.isEmpty()}" class="empty-state">
                <i class="fas fa-file-circle-xmark"></i>
                <p>No academic records found yet</p>
            </div>
        </div>
        <div style="display:flex; gap:1rem;">
            <a href="/student/dashboard" class="btn btn-secondary"><i class="fas fa-arrow-left"></i> Back to My Dashboard</a>
            <a href="/dashboard" class="btn btn-secondary"><i class="fas fa-home"></i> Home</a>
        </div>
    </div>
</body>
</html>
